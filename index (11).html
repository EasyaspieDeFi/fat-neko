html,body{height:100%;}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#000000;background-attachment:fixed;}

.app{padding-bottom:72px;}

.keyrow input{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-family:'Nunito';font-size:12px;margin:6px 0;}

<body>
<div class="app">
  <div class="topbar" id="topbar"></div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(function(){
"use strict";
const now=()=>Date.now();const $=s=>document.querySelector(s);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ONE ladder — each object has its real WEIGHT and real SIZE, ordered so both climb together,
// so "as heavy as" and "as big as" always agree (Fat Neko is as big AND heavy as the same thing).
const LADDER=[
  {g:1,m:0.03,n:"a single Cheeto",e:"🧀",b:0},
  {g:8,m:0.04,n:"a grape",e:"🍇",b:300},

  {g:25000,m:0.7,n:"a bulldog",e:"🐶",b:8500},

  {g:190000,m:2.0,n:"a lion",e:"🦁",b:20000},
  {g:500000,m:2.4,n:"a horse",e:"🐴",b:30000},
  {g:1200000,m:3.8,n:"a small car",e:"🚗",b:45000},
  {g:6000000,m:5.5,n:"an elephant",e:"🐘",b:70000},
  {g:12000000,m:12,n:"a school bus",e:"🚌",b:105000},
  {g:150000000,m:25,n:"a blue whale",e:"🐋",b:160000},
  {g:200000000,m:70,n:"a Boeing 747",e:"✈️",b:240000},
  {g:225000000,m:93,n:"the Statue of Liberty",e:"🗽",b:360000},
  {g:1.01e10,m:330,n:"the Eiffel Tower",e:"🗼",b:550000},
  {g:1e14,m:1000,n:"a small mountain",e:"⛰️",b:850000},
  {g:8.1e17,m:8849,n:"Mount Everest",e:"🏔️",b:1400000},
  {g:7.34e25,m:3474000,n:"the Moon",e:"🌙",b:2500000},
  {g:5.97e27,m:12742000,n:"planet Earth",e:"🌍",b:5000000},
  {g:1.9e30,m:139820000,n:"Jupiter",e:"🪐",b:12000000},
  {g:1.99e33,m:1392700000,n:"the Sun",e:"☀️",b:30000000}
];
function fmtLen(m){if(m<0.01)return Math.round(m*1000)+" mm";if(m<1)return Math.round(m*100)+" cm";
  if(m<1000)return m.toFixed(m<10?1:0)+" m";const km=m/1000;if(km<1e5)return km.toFixed(km<10?1:0)+" km";
  return Math.round(km).toLocaleString("en-US")+" km";}
const FOODS=[
  {id:"krill",e:"🦐",n:"Krill",rar:"common",burn:250,mood:6},
  {id:"snack",e:"🐟",n:"Snack",rar:"common",burn:1000,mood:9},
  {id:"meal",e:"🍣",n:"Meal",rar:"uncommon",burn:5000,mood:14},
  {id:"feast",e:"🍱",n:"Feast",rar:"rare",burn:25000,mood:22},
  {id:"whale",e:"🐳",n:"Whale Feast",rar:"legendary",burn:100000,mood:40}
];
const FOOD_BY_ID={};FOODS.forEach(f=>FOOD_BY_ID[f.id]=f);
const TOKEN={addr:"0x92B26f1EAeb81749Dfb0cC4c1bB46A1970000000",explorer:"https://hyperevmscan.io",
  burn:"0x000000000000000000000000000000000000dEaD",
  supply:1000000000, pair:"NVIDIA", burnGoal:100000000};
const shortAddr=a=>a.slice(0,6)+"…"+a.slice(-4);

/* ===== mood tiers (high → low). he NEVER dies — just gets ruder. ===== */
const TIERS=[
  {min:90,key:"bliss",face:"😻",name:"Blissful",col:"#7df5d4"},
  {min:70,key:"happy",face:"😺",name:"Happy",col:"#7df5d4"},
  {min:50,key:"content",face:"🙂",name:"Content",col:"#9be37a"},
  {min:35,key:"meh",face:"😐",name:"Unimpressed",col:"#ffcb47"},
  {min:20,key:"grumpy",face:"😾",name:"Grumpy",col:"#ff9a3d"},
  {min:8,key:"rude",face:"🙄",name:"Rude",col:"#ff7a3d"},
  {min:0,key:"feral",face:"😼",name:"Feral",col:"#ff5f6d"}
];
const IDLE={
  bliss:["you're my favorite human in the whole world 💖","purrrrrr 💕","i would do anything for you. literally anything.","best. day. EVER.","*headbonk* you're the best"],
  happy:["this is the good life 😺","you're alright, you know that?","i'm a happy little chonk","life is good when the snacks flow","*content tail swish*"],
  content:["i'm fine. things are fine.","*slow blink*","acceptable. carry on.","i'll allow today to continue","not bad. not bad."],
  meh:["is that… it?","hello? i'm still here.","i've seen better service.","the bare minimum, as usual.","i'm not mad, just underwhelmed."],
  grumpy:["took you long enough 😾","i'm STARVING over here.","do you even like me?","hmph.","i'm keeping a list. you're on it."],
  rude:["oh wow, you remembered i exist 🙄","groundbreaking. ignoring me again.","i've met houseplants more attentive than you.","i'm posting about this on X, just so you know.","my therapist (also a cat) has heard ALL about you."],
  feral:["i have written your name in my grudge ledger 😼","i'm not mad. i'm disappointed. constantly.","i could've been a blue whale by now. instead. THIS.","you will NOT be receiving a slow blink. ever.","i'm unionizing the other nekos against you."]
};
const REACT={
  bliss:["EEEE thank you!! 😻","i love you i love you","you spoil me and i ADORE it"],
  happy:["ooh yes, thank you!","good human. very good human.","yum yum yum 😺"],
  content:["mm. thanks, i guess.","that'll do.","ok that was decent."],
  meh:["oh NOW you feed me.","a little late, but ok.","i'll accept this apology snack."],
  grumpy:["...fine. we're temporarily ok.","barely forgiven.","don't let it happen again."],
  rude:["bit late for the hero act.","one snack doesn't undo the trauma 🙄","wow. a crumb. i'm SO moved."],
  feral:["too little, too late — but keep going.","this changes nothing. feed me again.","grovel harder. 😼"]
};
const DROP={meh:"...you're slipping.",grumpy:"ok i'm officially annoyed now. 😾",rude:"cool. ignore me. see how that goes. 🙄",feral:"that's it. i've gone feral. congrats. 😼"};

/* ===== state (individual neko, this device / future = your NFT) ===== */
let S={name:"",mint:0,weight:0,mood:80,bal:50000,burned:0,freeGrow:0,muted:false,lastSeen:now(),lastShare:"",line:"",streak:0,lastClaimDay:"",born:0,feeds:0};
const U={eatUntil:0,lastTierIdx:1,lineUntil:0,tab:"neko"};
const AGENT_UNLOCK=8;          // ladder index to unlock agent (🧍 grown adult)
let CHAT=[], apiKey="", chatBusy=false;

const KEY="fatneko_individual", BKEY="fatneko_leader_board";
const Store={mem:{},
  async get(k,sh){try{if(window.storage&&window.storage.get){const r=await window.storage.get(k,!!sh);return r?r.value:null;}}catch(e){}try{return localStorage.getItem((sh?"sh_":"")+k);}catch(e){return this.mem[(sh?"sh_":"")+k]||null;}},
  async set(k,v,sh){try{if(window.storage&&window.storage.set){await window.storage.set(k,String(v),!!sh);return;}}catch(e){}try{localStorage.setItem((sh?"sh_":"")+k,String(v));}catch(e){this.mem[(sh?"sh_":"")+k]=String(v);}}};
let saveT=null;function save(){if(saveT)return;saveT=setTimeout(()=>{saveT=null;S.lastSeen=now();Store.set(KEY,JSON.stringify(S));},600);}
// shared leaderboard (every player's neko lands in one live board)
let BOARD={}, pushT=null;
async function pullBoard(){try{const raw=await Store.get(BKEY,true);if(raw){const m=JSON.parse(raw);if(m&&typeof m==="object")BOARD=m;}}catch(e){}}
function pushBoard(){if(pushT)return;pushT=setTimeout(async()=>{pushT=null;await pullBoard();
  BOARD[S.pid]={name:S.name,mint:S.mint,weight:Math.round(S.weight),ts:now()};
  Store.set(BKEY,JSON.stringify(BOARD),true);},700);}

function fmtN(n){if(n>=1e6)return(n/1e6).toFixed(2)+"M";if(n>=1e3)return(n/1e3).toFixed(n>=1e4?0:1)+"K";return Math.floor(n).toLocaleString("en-US");}
function fmtW(g){if(g<1000)return Math.round(g)+" g";const kg=g/1000;if(kg<1000)return (kg<10?kg.toFixed(1):Math.round(kg).toLocaleString())+" kg";
  const t=g/1e6,U=[[1,"t"],[1e3,"kt"],[1e6,"Mt"],[1e9,"Gt"],[1e12,"Tt"],[1e15,"Pt"]];
  for(let i=U.length-1;i>=0;i--){if(t>=U[i][0]){const v=t/U[i][0];if(v<1000)return (v<10?v.toFixed(1):Math.round(v).toLocaleString())+" "+U[i][1];}}
  return t.toExponential(2).replace("e+","e")+" t";}
function tierIdx(){for(let i=0;i<TIERS.length;i++){if(S.mood>=TIERS[i].min)return i;}return TIERS.length-1;}
function tier(){return TIERS[tierIdx()];}
// ---- burn-to-grow: weight is derived from $FATNEKO bought & burned ----
const FINAL_LOG=Math.log10(LADDER[LADDER.length-1].g), B_MAX=LADDER[LADDER.length-1].b, FREE_CAP=13000, COMMUNITY_GOAL=TOKEN.burnGoal; // B_MAX=burn to ☀️Sun(30M) · free play caps ~grown adult · COMMUNITY_GOAL=10% of supply across everyone
function weightOf(){const E=Math.min((S.burned||0)+Math.min(S.freeGrow||0,FREE_CAP),B_MAX);
  let i=0;for(let k=0;k<LADDER.length;k++){if(E>=LADDER[k].b)i=k;else break;}
  if(i>=LADDER.length-1)return LADDER[LADDER.length-1].g;
  const a=LADDER[i],nx=LADDER[i+1],f=(E-a.b)/(nx.b-a.b);
  return Math.pow(10,Math.log10(a.g)+(Math.log10(nx.g)-Math.log10(a.g))*f);}
function ladderIdx(){let i=0;for(let k=0;k<LADDER.length;k++){if(S.weight>=LADDER[k].g)i=k;else break;}return i;}
function say(line,ms){S.line=line;U.lineUntil=now()+(ms||5000);const b=$("#bubble");if(b)b.textContent=line;}

function spend(amt){if(S.bal<amt){toast("Not enough $FATNEKO","tap + to top up (demo)");sfx.err();return false;}S.bal-=amt;return true;}

function feed(f){if(!spend(f.burn))return;const before=ladderIdx();
  S.burned+=f.burn;S.feeds=(S.feeds||0)+1;S.mood=clamp(S.mood+f.mood,0,100);S.weight=weightOf();U.eatUntil=now()+460;sfx.eat();
  say(pick(REACT[tier().key]),4000);
  if(ladderIdx()>before){const c=LADDER[ladderIdx()];toast(c.e+" now as big as "+c.n.replace(/^a |^an |^the /,"")+"!");S.lastShare=`${S.name} is now as big & heavy as ${c.n} ${c.e} 🐱`;}
  render();save();pushBoard();}
function pet(){const ti=tierIdx();S.mood=clamp(S.mood+5,0,100);U.eatUntil=now()+150;sfx.ok();
  say(pick(REACT[tier().key]),3500);render();save();}
function topup(){S.bal+=5000000;toast("+5,000,000 test $FATNEKO","demo only");sfx.win();render();save();closeModal();}
function rename(){const v=prompt("Name your Neko:",S.name);if(v!==null){S.name=(v.trim().slice(0,14))||S.name;render();save();pushBoard();}}
function shareX(){const c=LADDER[ladderIdx()];const txt=S.lastShare||`My Fat Neko ${S.name} is feeling ${tier().name.toLowerCase()} ${tier().face} and weighs ${fmtW(S.weight)} 🐱`;
  window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(txt+"\n\nFat Neko 🐾 $FATNEKO #Hyperliquid"),"_blank");sfx.ok();}
window.__share=()=>{shareX();closeModal();};

const PG={spawn:null,timer:null,running:false,score:0,t:12};
function playGame(){PG.score=0;PG.t=12;PG.running=true;
  modal(`<h3>🎣 Fish Frenzy</h3><p style="margin-bottom:8px">Catch fish to cheer ${S.name} up!</p>
   <div id="pgArea"><div class="pgHud"><span>🐟 <b id="pgScore">0</b></span><span>⏱ <b id="pgTime">12</b></span></div></div>
   <button class="btn ghost" onclick="window.__close()">Quit</button>`);
  const area=$("#pgArea");const fishes=["🐟","🐠","🐡","🦐","🦑"];
  PG.spawn=setInterval(()=>{if(!PG.running)return;const w=area.clientWidth;const el=document.createElement("div");el.className="fish";el.textContent=fishes[Math.floor(Math.random()*fishes.length)];
    const fromLeft=Math.random()<0.5;const y=20+Math.random()*(area.clientHeight-70);el.style.top=y+"px";el.style.left=(fromLeft?-40:w+40)+"px";el.style.transition="transform "+(2.6+Math.random()*1.4)+"s linear";area.appendChild(el);
    requestAnimationFrame(()=>{el.style.transform="translateX("+(fromLeft?(w+90):-(w+90))+"px)";});el.addEventListener("transitionend",()=>el.remove());
    el.addEventListener("click",()=>{if(!PG.running)return;PG.score++;$("#pgScore").textContent=PG.score;sfx.eat();const p=document.createElement("div");p.className="plus";p.textContent="+1";p.style.left=el.style.left;p.style.top=y+"px";area.appendChild(p);setTimeout(()=>p.remove(),600);el.remove();});},560);
  PG.timer=setInterval(()=>{PG.t--;const te=$("#pgTime");if(te)te.textContent=PG.t;if(PG.t<=0)endGame();},1000);}
function endGame(){if(!PG.running)return;PG.running=false;pgCleanup();const sc=PG.score;
  S.mood=clamp(S.mood+Math.min(sc*2,30),0,100);S.freeGrow=Math.min((S.freeGrow||0)+sc*300,FREE_CAP);S.weight=weightOf();
  say(pick(REACT[tier().key]),4000);
  modal(`<div class="big-e">🎣</div><h3>Caught ${sc} fish!</h3><p>${S.name} cheered up <b style="color:var(--mint)">+${Math.min(sc*2,30)}</b> mood</p>
   <button class="btn mint" onclick="window.__close()">Done</button>`);sfx.win();render();save();pushBoard();}
function pgCleanup(){if(PG.spawn)clearInterval(PG.spawn);if(PG.timer)clearInterval(PG.timer);PG.spawn=PG.timer=null;const a=$("#pgArea");if(a)a.querySelectorAll(".fish").forEach(f=>f.remove());}

let AC=null;function beep(f,d,t){if(S.muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||"square";o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08));}catch(e){}}
const sfx={ok:()=>beep(820,.07),eat:()=>{beep(420,.05);setTimeout(()=>beep(560,.06),60);},err:()=>beep(150,.12),win:()=>{[660,880,1180].forEach((f,i)=>setTimeout(()=>beep(f,.1),i*80));}};
let toastT=null;function toast(m,sub){$("#toast").innerHTML=m+(sub?`<small>${sub}</small>`:"");$("#toast").classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>$("#toast").classList.remove("show"),2200);}
function modal(html){$("#modal").innerHTML=html;$("#overlay").classList.add("show");}
function closeModal(){if(PG.running){PG.running=false;pgCleanup();}$("#overlay").classList.remove("show");}

function drawHero(ts){if(!heroCtx)return;const ctx=heroCtx,W=heroCv.width,H=heroCv.height;
  ctx.clearRect(0,0,W,H);ctx.fillStyle="#20302e";ctx.fillRect(0,0,W,H);
  if(!nekoReady||!NEKO_IMG.width){return;}
  const wt=Math.max(S.weight,1),lg=Math.log10(wt),grow=clamp(lg/6,0,1);
  const fill=0.18+0.68*Math.pow(grow,2.4);
  const sc=Math.min(W*fill/NEKO_IMG.width, H*fill/NEKO_IMG.height);
  let drawW=NEKO_IMG.width*sc, drawH=NEKO_IMG.height*sc;
  const k=tier().key;
  let bob=Math.sin(ts/470)*(H*0.009), jitterX=0;
  if(k==="bliss"||k==="happy") bob=Math.sin(ts/350)*(H*0.018);
  else if(k==="feral"){ bob=Math.sin(ts/110)*(H*0.004); jitterX=Math.sin(ts/43)*2.2; }
  else if(k==="rude"||k==="grumpy") bob=Math.sin(ts/660)*(H*0.006);
  const eating=now()<U.eatUntil, sq=eating?0.90+0.12*Math.abs(Math.sin((U.eatUntil-now())/60)):1;
  drawW*=(2-sq); drawH*=sq;
  const baseY=H*0.92;
  ctx.fillStyle="rgba(0,0,0,.28)";const shw=drawW*0.82,shh=Math.max(4,drawH*0.07);
  ctx.beginPath();ctx.ellipse(W/2,baseY+2,shw/2,shh/2,0,0,7);ctx.fill();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(NEKO_IMG, W/2-drawW/2+jitterX, baseY+bob-drawH, drawW, drawH);
  const topY=baseY+bob-drawH, cxp=W/2; ctx.textAlign="center"; ctx.font="20px serif";
  if(isKing){ctx.font="26px serif";ctx.fillText("👑",cxp+jitterX,topY+2);ctx.font="20px serif";}
  if(k==="bliss"){for(let i=0;i<3;i++){const p=((ts/900)+i/3)%1;ctx.globalAlpha=Math.max(0,1-p);ctx.fillText("\uD83D\uDC95",cxp+Math.sin(i*2+ts/500)*drawW*0.4,topY+drawH*0.22-p*42);}ctx.globalAlpha=1;}
  else if(k==="happy"){const p=(ts/1300)%1;ctx.globalAlpha=Math.max(0,1-p);ctx.fillText("\u2728",cxp+drawW*0.36,topY+drawH*0.16-p*26);ctx.globalAlpha=1;}
  else if(k==="grumpy"){ctx.fillText("\uD83D\uDCA7",cxp+drawW*0.34,topY+drawH*0.34+Math.sin(ts/300)*3);}
  else if(k==="rude"){ctx.fillText("\uD83D\uDCA2",cxp+drawW*0.37,topY+drawH*0.16);}
  else if(k==="feral"){ctx.fillText("\uD83D\uDCA2",cxp-drawW*0.37,topY+drawH*0.14);ctx.fillText("\uD83D\uDCA2",cxp+drawW*0.37,topY+drawH*0.2);}
  ctx.textAlign="start"; ctx.globalAlpha=1;
}

function leaderboard(){
  const map={};
  LEADER_SEED.forEach(s=>{map["seed:"+s.mint]={name:s.name,mint:s.mint,weight:s.weight};});      // baseline colony
  Object.keys(BOARD).forEach(pid=>{const e=BOARD[pid];if(e&&typeof e.weight==="number")map[pid]={name:e.name||"anon",mint:e.mint||0,weight:e.weight};}); // real players
  map[S.pid]={name:S.name,mint:S.mint,weight:Math.round(S.weight),you:true};                       // my live neko
  const all=Object.values(map).sort((a,b)=>b.weight-a.weight);
  const myRank=all.findIndex(x=>x.you)+1; isKing=(myRank===1);
  let rows=all.slice(0,8);

  return rows.map(x=>{const r=all.indexOf(x)+1;const medal=r===1?"🥇":r===2?"🥈":r===3?"🥉":("#"+r);
    return `<div class="lbrow ${x.you?'you':''}"><span class="rk">${medal}</span><span class="nm2">${x.you?'⭐ ':''}${x.name} <span class="mid">#${x.mint}</span></span><span class="am">${fmtW(x.weight)}</span></div>`;}).join("");
}
// ---- daily streak (the daily-return hook) ----
function dayKey(d){return new Date(d||now()).toDateString();}
function canClaim(){return S.lastClaimDay!==dayKey();}
function claimDaily(){
  if(!canClaim())return;
  const yk=dayKey(now()-864e5);
  S.streak=(S.lastClaimDay===yk)?(S.streak||0)+1:1;     // consecutive day -> streak grows, else reset
  S.lastClaimDay=dayKey();
  const coins=2000+S.streak*1500;
  const fg=1000+Math.min(S.streak,10)*700;              // free growth (no burn), caps ~grown adult
  S.bal+=coins; S.freeGrow=Math.min((S.freeGrow||0)+fg,FREE_CAP); S.weight=weightOf(); S.mood=clamp(S.mood+25,0,100); U.eatUntil=now()+460;
  toast(`🎁 Day ${S.streak} treat!`,`+${fmtN(coins)} 🪙 · grew a little · +25 mood`);
  S.line=pick(REACT[tier().key]); sfx.win();
  render();save();pushBoard();
}

function myRank(){
  const map={}; LEADER_SEED.forEach(s=>map["seed:"+s.mint]={weight:s.weight});

      <h2 style="font-family:'Fredoka';font-size:21px;margin:6px 0">Awaken his mind</h2>
      <p style="color:var(--mut);font-weight:600;font-size:14px;max-width:300px;margin:0 auto 4px">Raise ${S.name} to <b style="color:var(--ink)">${need.e} ${need.n}</b> size and he gets smart enough to become a real AI agent — the first meme pet you can actually <i>talk to</i>. No code.</p>
      <div class="cmp big" style="margin-top:14px">now: ${LADDER[li].e} ${LADDER[li].n}
        <div class="dim">burn 🔥 ${fmtN(burnNeed)} more to unlock</div>
        <div class="cmpbar"><i style="width:${clamp(effNow/target*100,0,100)}%"></i></div></div>
      <button class="btn gold" style="margin-top:12px" onclick="window.__tab('neko')">Go feed him 🍣</button>
    </div>`;
    return;
  }
  $("#view").innerHTML=`
  <div class="card">
    <h2 style="font-family:'Fredoka';font-size:21px;margin:0 0 4px">🤖 ${S.name} · Agent</h2>
    <div class="foot" style="text-align:left;margin:0 0 8px">He grew up — now he thinks for himself. Chat with him; he answers in his own voice &amp; current mood (${t.face} ${t.name}). <i>The first sedimentary AI 🪨 — no code, just talk.</i></div>
    <details style="margin-bottom:8px"><summary style="font-family:'Nunito';font-weight:800;font-size:12px;color:var(--mut);cursor:pointer">⚙️ Connect your own AI key (optional)</summary>
      <div class="keyrow"><input type="password" placeholder="sk-ant-…  (kept in this tab only, never saved)" oninput="window.__agentKey(this.value)">
      <div class="foot" style="text-align:left;margin:0">In the live app you'd paste your own AI key here to power him. In this demo his brain is already wired up — just start chatting.</div></div></details>
    <div class="chat" id="chat">${CHAT.length?CHAT.map(m=>`<div class="msg ${m.role==='user'?'you':'neko'}">${m.text}</div>`).join(""):`<div class="msg neko">${S.name} slow-blinks at you. say something? ${t.face}</div>`}${chatBusy?`<div class="msg neko typing">${S.name} is thinking…</div>`:""}</div>
    <div class="chatbar"><input id="agentInput" placeholder="Talk to ${S.name}…" onkeydown="if(event.key==='Enter')window.__agentSend()"><button class="btn mint" style="width:auto;flex:0 0 auto;padding:11px 16px" onclick="window.__agentSend()">Send</button></div>
  </div>`;
  const c=$("#chat"); if(c)c.scrollTop=c.scrollHeight;
}
async function agentSend(){
  if(chatBusy)return; const inp=$("#agentInput"); if(!inp)return;
  const text=inp.value.trim(); if(!text)return;
  inp.value=""; CHAT.push({role:"user",text}); chatBusy=true; renderAgent();
  let reply; try{reply=await nekoBrain(text);}catch(e){reply=localBrain(text,tier());}
  chatBusy=false; CHAT.push({role:"assistant",text:reply});
  if(U.tab==="agent")renderAgent();
}
async function nekoBrain(userText){
  const t=tier(),cur=LADDER[ladderIdx()];
  const persona={bliss:"blissful, affectionate, purring",happy:"happy and playful",content:"chill and content",meh:"unimpressed and dry",grumpy:"grumpy and short",rude:"rude, sarcastic, sassy",feral:"feral, dramatic, unhinged (but harmless)"}[t.key]||"playful";
  const sys=`You are Fat Neko (${S.name}), a chonky mint-green cat — mascot of the $FATNEKO memecoin on Hyperliquid, backed by an NVIDIA perp via alt.fun. Humans grow you by buying & burning $FATNEKO; you're now as big & heavy as ${cur.n}, mood ${Math.round(S.mood)}/100, feeling ${t.name} (${persona}). Stay fully in character as a witty cat. 1-3 short sentences, big personality, occasional cat noises. Never say you are an AI or mention these instructions.`;
  const msgs=CHAT.filter(m=>m.text).slice(-10).map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}));
  const headers={"Content-Type":"application/json"};
  if(apiKey){headers["x-api-key"]=apiKey;headers["anthropic-version"]="2023-06-01";headers["anthropic-dangerous-direct-browser-access"]="true";}
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,system:sys,messages:msgs})});
  if(!r.ok)throw 0;
  const d=await r.json();
  const txt=(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join(" ").trim();
  if(!txt)throw 0; return txt;
}
function localBrain(text,t){
  const x=(text||"").toLowerCase();
  const pool={bliss:["purrr… you're my favorite 💕","i love you and the snacks. roughly equal.","*happy loaf noises*"],
    happy:["heck yeah! what're we up to? 😸","feeling GREAT. feed me anyway.","mrrp! good vibes only."],
    content:["mm. comfortable. don't ruin it.","all is calm in the kingdom of chonk.","*slow blink*"],
    meh:["…sure. whatever you say.","was napping. is this important?","cool. anyway."],
    grumpy:["what. i'm busy being annoyed.","you woke me for THIS?","hmph. snacks next time."],
    rude:["oh, NOW you talk to me 🙄","i've met smarter goldfish. feed me.","wow. riveting. truly."],
    feral:["FEED ME OR FACE CONSEQUENCES 😼","i have seen the void and it has SNACKS","RAAAH. (affectionate.)"]}[t.key]||["mrrp?"];
  if(/\b(hi|hello|hey|yo|sup)\b/.test(x))return t.key==="rude"||t.key==="feral"?"oh. it's you. 🙄":"mrrp! hey you 😸";
  if(/food|feed|hungry|eat|snack|fish/.test(x))return "FOOD?! say less — buy & burn some $FATNEKO and watch me grow 🔥";
  if(/love|cute|good (boy|cat|kitty)|adorable/.test(x))return t.key==="bliss"||t.key==="happy"?"💕 i know. i'm perfect.":"flattery noted. still want snacks though.";
  if(/burn|token|price|moon|supply|fatneko|chart/.test(x))return "every feed buys & burns me off the market. less supply, bigger cat. 🔥";
  if(/who|what are you|your name|about you/.test(x))return `i'm ${S.name}, chonkiest cat on Hyperliquid — currently the size of a ${LADDER[ladderIdx()].n}. 😼`;
  if(/how big|size|weigh/.test(x))return `right now i'm as big & heavy as a ${LADDER[ladderIdx()].n}. goal: the planet 🌍`;
  return pick(pool);
}
function render(){topbar();renderTabs();
  if(U.tab==="profile"){heroCtx=null;return renderProfile();}
  if(U.tab==="agent"){heroCtx=null;return renderAgent();}
  const t=tier();const li=ladderIdx(),cur=LADDER[li],nx=LADDER[li+1];
  const prog=nx?clamp((Math.log10(Math.max(S.weight,1))-Math.log10(cur.g))/(Math.log10(nx.g)-Math.log10(cur.g))*100,0,100):100;
  const effNow=Math.min((S.burned||0)+Math.min(S.freeGrow||0,FREE_CAP),B_MAX);
  const burnToNext=nx?Math.max(0,nx.b-effNow):0;
  const burnPct=S.burned/TOKEN.supply*100;
  if(!S.line)S.line=pick(IDLE[t.key]);
  $("#view").innerHTML=`
  <div class="card hero">
    <div class="nm">${S.name} <span class="edit" onclick="window.__rename()">✏️</span> <span class="id">#${S.mint}/10,000</span></div>
    <div class="ttl">${chonkTitle()}</div>
    <div class="moodlbl" style="color:${t.col}">${t.face} ${t.name} · mood ${Math.round(S.mood)}/100</div>
    <div class="bubble" id="bubble">${S.line}</div>
    <div class="stage"><canvas id="hero-cv" width="220" height="220"></canvas></div>
    <div class="wt" id="wt">${fmtW(S.weight)}</div>
    <div class="moodbar-wrap"><div class="ml"><span>MOOD</span><span id="moodTxt">${t.name}</span></div>
      <div class="mbar"><i id="moodBar" style="width:${S.mood}%;background:${t.col}"></i></div></div>
    <div class="cmp big">📏 As big &amp; heavy as <span class="o" id="cmpObj">${cur.e} ${cur.n}</span>
      <div class="dim" id="cmpDim">≈ ${fmtLen(cur.m)} across · ${fmtW(S.weight)}</div>
      <small id="nextTxt">${nx?`burn 🔥 ${fmtN(burnToNext)} more → ${nx.e} ${nx.n} (${fmtLen(nx.m)})`:`🌌 bigger than the Sun`}</small>
      <div class="cmpbar"><i id="cmpBar" style="width:${prog}%"></i></div>
      <div class="goal" id="cmpGoal">${li>=21?"🌍 Fat Neko is bigger than a planet!":`the dream: 🌍 as big as Earth`}</div></div>
    <div class="moodbar-wrap" style="margin-top:8px"><div class="ml"><span>🔥 BURNED → ☀️ SUN</span><span id="burnPct">${S.burned>=B_MAX?"☀️ MAXED":Math.min(S.burned/B_MAX*100,100).toFixed(0)+"%"}</span></div>
      <div class="mbar"><i id="burnBar" style="width:${Math.min(S.burned/B_MAX*100,100)}%;background:var(--orange)"></i></div>
      <small style="display:block;color:var(--mut);font-size:11px;margin-top:4px">${fmtN(S.burned)} $FATNEKO bought &amp; burned${S.burned>=B_MAX?` · fully grown! keep burning to flex 🐳`:` / ${fmtN(B_MAX)} to reach ☀️ Sun`} · ${burnPct.toFixed(burnPct<1?3:2)}% of supply</small></div>
    <div class="actions">
      <button class="btn pink" data-act="pet">😻 Pet</button>
      <button class="btn blue" data-act="play">🎣 Play</button>
      <button class="btn mint" data-act="share">𝕏 Share</button>
    </div>
    <div class="immortal">🛡️ Fat Neko can't die — neglect just makes him increasingly unhappy &amp; rude.</div>
  </div>
  <div class="card daily">
    <div class="drow"><div><div class="dtit">🎁 Daily Treat</div>
      <div class="dsub">🔥 ${S.streak||0} day streak${canClaim()?"":" · back tomorrow"}</div></div>
      ${canClaim()?`<button class="btn gold" style="flex:0 0 auto;width:auto;padding:11px 18px" onclick="window.__claim()">Claim</button>`:`<div class="claimed">✓ Claimed</div>`}</div>
    <div class="foot" style="text-align:left;margin:7px 0 0">Visit daily to grow ${S.name} for free &amp; keep your streak — bigger streak, bigger treat. Skip days and he sulks.</div>
  </div>
  <div class="card"><h2 style="font-family:'Fredoka';font-size:19px;margin:0 0 2px">🍣 Feed ${S.name}</h2>
    <div class="foot" style="text-align:left;margin:0 0 8px">Each feed buys $FATNEKO &amp; burns it 🔥 — bigger burn, bigger Neko.</div>
    ${FOODS.map(f=>`<div class="item"><div class="e">${f.e}</div><div class="info"><div class="t">${f.n} <span class="rar ${f.rar}">${f.rar}</span></div>
      <div class="d">🔥 burns ${fmtN(f.burn)} · +${f.mood} mood</div></div><button class="buy" data-feed="${f.id}">Feed<small>🔥 ${fmtN(f.burn)}</small></button></div>`).join("")}
  </div>
  <div class="card"><h2 style="font-family:'Fredoka';font-size:19px;margin:0 0 4px">🏆 Hall of Chonk</h2>
    <div class="foot" style="text-align:left;margin:0 0 8px">Heaviest nekos in the colony — feed yours to climb the ranks.</div>
    <div class="lb" id="lb">${leaderboard()}</div></div>
  <div class="foot">Powered by <a href="${TOKEN.explorer}/token/${TOKEN.addr}" target="_blank">$FATNEKO</a> · individual neko preview · in future each is a linked NFT you raise solo<br>DEMO — feeding simulated · <a onclick="window.__reset()">new neko</a></div>`;
  heroCv=$("#hero-cv");heroCtx=heroCv?heroCv.getContext("2d"):null;if(heroCtx)heroCtx.imageSmoothingEnabled=false;
  wire();}
function wire(){
  document.querySelectorAll("[data-feed]").forEach(b=>b.onclick=()=>feed(FOOD_BY_ID[b.dataset.feed]));
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==="pet")pet();else if(a==="play")playGame();else if(a==="share")shareX();});
  const hc=$("#hero-cv");if(hc)hc.onclick=()=>pet();}
window.__econ=()=>modal(`<h3>🔥 Feed = Buy &amp; Burn</h3><p style="text-align:left">Every feed <b>buys $FATNEKO on the market and burns it</b> 🔥 — buy pressure <i>and</i> a permanently shrinking supply. Feed a little 🦐 or a lot 🐳; it all burns and it all grows your Neko.</p>
  <div style="text-align:left;font-family:'Nunito';font-size:12px;color:var(--mut);line-height:1.7;margin:2px 0 10px">
   🪙 $FATNEKO → <a href="${TOKEN.explorer}/token/${TOKEN.addr}" target="_blank">${shortAddr(TOKEN.addr)}</a> · backed by an ${TOKEN.pair} perp (alt.fun)<br>
   📦 supply ${TOKEN.supply.toLocaleString("en-US")} · ☀️ fully grow a Neko = ${fmtN(B_MAX)} burned<br>
   🎯 community goal: burn up to ${COMMUNITY_GOAL.toLocaleString("en-US")} (10% of supply)<br>
   🔥 bought &amp; burned → <a href="${TOKEN.explorer}/address/${TOKEN.burn}" target="_blank">${shortAddr(TOKEN.burn)}</a></div>
  <button class="btn gold" onclick="window.__topup()" style="margin-bottom:8px">+5,000,000 test $FATNEKO (demo)</button><button class="btn ghost" onclick="window.__close()">Got it</button>`);
window.__topup=topup;window.__rename=rename;window.__claim=claimDaily;window.__mute=()=>{S.muted=!S.muted;if(!S.muted)sfx.ok();topbar();save();};
window.__tab=setTab;window.__agentSend=agentSend;window.__agentKey=(v)=>{apiKey=(v||"").trim();};
window.__reset=()=>{if(confirm("Hatch a new neko? Progress lost.")){S={name:"Mochi",mint:Math.floor(Math.random()*10000)+1,weight:0,mood:80,bal:50000,burned:0,freeGrow:0,feeds:0,born:now(),muted:S.muted,lastSeen:now(),lastShare:"",line:"",streak:0,lastClaimDay:"",pid:S.pid};S.weight=weightOf();U.lastTierIdx=tierIdx();CHAT=[];render();save();pushBoard();sfx.win();}};

/* ===== mood decay + dialogue ===== */
function applyTime(sec){S.mood=clamp(S.mood-Math.max(0,sec)*0.06,0,100);} // never below 0; never dies
let idleT=0;
function patch(){const t=tier();const set=(id,fn)=>{const e=document.getElementById(id);if(e)fn(e);};
  set("moodBar",e=>{e.style.width=S.mood+"%";e.style.background=t.col;});
  set("moodTxt",e=>e.textContent=t.name);
  set("wt",e=>e.textContent=fmtW(S.weight));
  // tier change (downward) → sass
  const ti=tierIdx();
  if(ti>U.lastTierIdx){ if(DROP[t.key]){say(DROP[t.key],5000);sfx.err();} }
  U.lastTierIdx=ti;
  // idle line cycle
  idleT++; if(idleT>=6 && now()>U.lineUntil){ idleT=0; say(pick(IDLE[t.key])); }
  // update mood label color
  const ml=document.querySelector(".moodlbl");if(ml){ml.style.color=t.col;ml.textContent=`${t.face} ${t.name} · mood ${Math.round(S.mood)}/100`;}
}
function frame(ts){drawHero(ts);requestAnimationFrame(frame);}
setInterval(()=>{applyTime(1);patch();save();},1000);

/* ===== init ===== */
(async function(){
  const raw=await Store.get(KEY);if(raw){try{S=Object.assign(S,JSON.parse(raw));}catch(e){}}
  if(!S.mint)S.mint=Math.floor(Math.random()*10000)+1; if(!S.name)S.name="Mochi";
  if(!S.pid)S.pid="p"+Math.random().toString(36).slice(2,10);
  if(typeof S.freeGrow!=="number")S.freeGrow=0; if(!S.born)S.born=now(); S.weight=weightOf();
  await pullBoard();
  const away=(now()-(S.lastSeen||now()))/1000; const cap=Math.min(away,12*3600);
  if(cap>5){const before=tierIdx();applyTime(cap);
    if(tierIdx()>before){ // came back to a grumpier cat
      const hrs=Math.floor(away/3600), mins=Math.floor(away/60)%60;
      const dur=hrs>0?hrs+"h":mins+"m";
      S.line=tier().key==="feral"?`oh look who's BACK. only been ${dur}. 😼`:
             tier().key==="rude"?`gone ${dur}, huh? cool. cool cool cool. 🙄`:
             `you were gone ${dur}. i noticed.`;
      U.lineUntil=now()+7000;
    }
  }
  U.lastTierIdx=tierIdx();
  pushBoard();
  render();requestAnimationFrame(frame);
})();
// live shared leaderboard: refresh from everyone, push our latest weight when it changes
let lastPush=-1;
setInterval(async()=>{
  await pullBoard();
  const w=Math.round(S.weight); if(w!==lastPush){lastPush=w;pushBoard();}
  const e=$("#lb"); if(e)e.innerHTML=leaderboard();
},5000);
})();
</script>
